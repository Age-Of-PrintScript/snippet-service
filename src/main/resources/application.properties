spring.application.name=snippet-service

# Datasource configuration (with environment variable overrides)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/snippet_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# External Services
services.asset.url=${ASSET_SERVICE_URL:http://localhost:8083}
services.permissions.url=${PERMISSIONS_SERVICE_URL:http://localhost:8081}
services.printscript.url=${PRINTSCRIPT_SERVICE_URL:http://localhost:8082}

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Auth0 (JWT resource server)
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://${AUTH0_DOMAIN:example.us.auth0.com}/
spring.security.oauth2.resourceserver.jwt.audiences=${AUTH0_AUDIENCE:https://snippet-api-dev}
